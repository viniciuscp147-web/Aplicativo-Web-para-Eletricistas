<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#C2410C">
<title>Eletric Calculator</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#F8FAFC;--s:#fff;--sv:#F1F5F9;--on:#1E293B;--onv:#64748B;--p:#C2410C;--onp:#fff;--pc:#FFEDD5;--onpc:#7C2D12;--sc:#E0F2FE;--onsc:#0369A1;--ol:#CBD5E1;--err:#DC2626;--ok:#16A34A;--warn:#D97706}
@media(prefers-color-scheme:dark){:root{--bg:#0F172A;--s:#1E293B;--sv:#334155;--on:#F1F5F9;--onv:#94A3B8;--p:#FB923C;--onp:#0F172A;--pc:#B34700;--onpc:#F8FAFC;--sc:#0369A1;--onsc:#F8FAFC;--ol:#475569}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--on);font:16px/1.4 system-ui,Roboto,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--s);color:var(--p);text-align:center;font-weight:800;font-size:22px;letter-spacing:.5px;padding:12px;box-shadow:0 1px 4px #0002}
main{max-width:720px;margin:0 auto;padding:12px 16px 96px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--s);display:flex;justify-content:center;box-shadow:0 -1px 6px #0003}
nav button{flex:1;max-width:180px;background:none;border:0;color:var(--onv);padding:8px 2px;font:600 11px system-ui;cursor:pointer;position:relative}
nav button b{display:block;font-size:20px;margin:0 auto 2px;width:56px;border-radius:14px;line-height:30px}
nav button.on{color:var(--p)}nav button.on b{background:var(--pc)}
nav i{position:absolute;top:4px;left:55%;background:var(--err);color:#fff;border-radius:9px;font:700 10px/16px system-ui;min-width:16px;padding:0 4px}
h1{font-size:22px;margin:0}.sub{color:var(--onv);font-size:13px;margin:0 0 14px}h3{margin:16px 0 8px;font-size:16px}
.card{background:var(--s);border-radius:16px;padding:16px;box-shadow:0 1px 4px #0003;margin:14px 0}
.row{display:flex;gap:8px;align-items:center}.sb{justify-content:space-between}.sc{overflow-x:auto;padding:4px 0}.g1>*{flex:1}
.chip,.btn,.tb{border:0;border-radius:10px;padding:8px 10px;font:600 12px system-ui;cursor:pointer;background:var(--sv);color:var(--onv);white-space:nowrap}
.chip.on,.tb.on{background:var(--p);color:var(--onp);font-weight:800}.chip small{display:block;font-size:10px;font-weight:700;opacity:.9}
.btn{background:var(--sc);color:var(--onsc);padding:6px 2px;border-radius:8px}.big{display:block;width:100%;background:var(--p);color:var(--onp);font-size:15px;padding:14px;border-radius:12px;margin-top:12px}
.big.o{background:none;color:var(--p);border:1px solid var(--p)}.tb{flex:1;padding:12px;text-align:center}
.f{display:block;margin:10px 0 6px;flex:1;min-width:0}.f span{display:block;font-size:12px;color:var(--onv);margin-bottom:2px}
input[type=text],input:not([type]),select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ol);background:var(--s);color:var(--on);font:16px system-ui}
.res{font-size:13px}.res .l{display:flex;justify-content:space-between;gap:10px;margin:6px 0}.res .l b{text-align:right}
.badge{display:inline-flex;gap:6px;border-radius:8px;padding:5px 10px;font:700 11px system-ui}.num{font-size:36px;font-weight:900;line-height:1.1}.num2{font-size:26px;font-weight:800;text-align:right}
.bar{height:8px;border-radius:4px;background:var(--sv);margin:10px 0 14px;overflow:hidden}.bar i{display:block;height:100%}
hr{border:0;border-top:1px solid var(--ol);margin:12px 0}.note{background:var(--pc);color:var(--onpc);border-radius:8px;padding:10px;font-size:13px;margin-top:8px}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%;border:1px solid #fff8;vertical-align:middle;margin-right:6px;flex:none}
.col{padding:8px 10px;border:2px solid transparent;border-radius:12px;background:var(--sv);cursor:pointer;font:13px system-ui;color:var(--on);white-space:nowrap}.col.on{border-color:var(--p);font-weight:700}
.pv{background:var(--sv);border-radius:16px;padding:14px;display:flex;gap:14px;align-items:center}.pv .cut{width:84px;height:84px;border-radius:50%;background:#0F172A;display:grid;place-items:center;flex:none}
.item{display:flex;gap:12px;align-items:center;background:var(--s);border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0003}.item .dot{width:36px;height:36px;display:grid;place-items:center;font:700 10px system-ui}
.x{background:none;border:0;color:var(--err);font-size:20px;cursor:pointer}.ic{background:var(--sv);color:var(--on);border:0;border-radius:12px;width:48px;height:48px;font-size:20px;cursor:pointer;flex:none}
.tot{background:var(--pc);color:var(--onpc);border-radius:16px;padding:16px}.tot .big2{font-size:24px;font-weight:800;color:var(--p)}
input[type=range]{width:100%;accent-color:var(--p)}.empty{text-align:center;padding:48px 16px;color:var(--onv)}.empty b{font-size:22px;color:var(--on);display:block;margin:8px 0}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#334155;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;max-width:90%;z-index:9;display:none}
</style>
</head>
<body>
<header>Eletric Calculator</header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script src="js/calc.js"></script>
<script src="js/app.js"></script>
</body>
</html>
